<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Promos EC — descuentos de Ecuador en un solo lugar</title>
<style>
  :root{
    --bg:#0e1013; --panel:#161a20; --panel2:#1c222a; --line:#2a323d;
    --tx:#e8ecf1; --tx2:#98a4b3; --tx3:#6b7787; --ac:#3ecf8e; --ac-tx:#08130d;
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#f7f8fa; --panel:#fff; --panel2:#f0f2f6; --line:#dfe3ea;
           --tx:#12161c; --tx2:#5a6675; --tx3:#8b96a5; }
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--tx);
    font:15px/1.5 ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased}
  .wrap{max-width:1100px;margin:0 auto;padding:28px 18px 60px}

  header h1{font-size:24px;letter-spacing:-.02em}
  header p{color:var(--tx2);font-size:13.5px;margin-top:3px}

  .controles{display:flex;flex-wrap:wrap;gap:9px;margin:22px 0 6px}
  input,select{background:var(--panel);color:var(--tx);border:1px solid var(--line);
    border-radius:9px;padding:10px 12px;font:inherit;font-size:14px;outline:none}
  input{flex:1 1 260px}
  input:focus,select:focus{border-color:var(--ac)}
  label.chk{display:flex;align-items:center;gap:7px;color:var(--tx2);font-size:13.5px;
    padding:10px 4px;cursor:pointer;user-select:none}
  .conteo{color:var(--tx3);font-size:13px;margin:12px 0 16px}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:14px}
  .promo{background:var(--panel);border:1px solid var(--line);border-radius:13px;
    overflow:hidden;display:flex;flex-direction:column}
  .promo img{width:100%;aspect-ratio:16/9;object-fit:cover;background:var(--panel2);
    display:block;border-bottom:1px solid var(--line)}
  .cuerpo{padding:13px 14px 14px;display:flex;flex-direction:column;flex:1;gap:6px}
  .meta{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
  .cat{font-size:10px;letter-spacing:.09em;text-transform:uppercase;font-weight:700;
    color:var(--tx3);border:1px solid var(--line);border-radius:20px;padding:2px 8px}
  .banco{font-size:11px;color:var(--tx3)}
  .comercio{font-size:12.5px;font-weight:700;color:var(--ac);letter-spacing:.01em}
  .titulo{font-size:15px;font-weight:640;line-height:1.32}
  .detalle{font-size:13px;color:var(--tx2)}
  .pie{margin-top:auto;padding-top:11px;display:flex;align-items:center;
    justify-content:space-between;gap:9px}
  .vence{font-size:11.5px;color:var(--tx3)}
  .vence.pronto{color:#f5a623}
  .btn{background:var(--ac);color:var(--ac-tx);border:none;border-radius:8px;
    padding:8px 13px;font:inherit;font-size:13px;font-weight:650;cursor:pointer;
    text-decoration:none;white-space:nowrap}
  .btn.sec{background:transparent;color:var(--tx2);border:1px solid var(--line)}
  .btn:active{transform:translateY(1px)}
  .vacio{color:var(--tx2);padding:50px 0;text-align:center}
</style>
</head>
<body><div class="wrap">

<header>
  <h1>Promos EC</h1>
  <p>Descuentos y beneficios de Ecuador, en un solo lugar. <span id="sello"></span></p>
</header>

<div class="controles">
  <input id="q" type="search" placeholder="Buscar comercio o promoción…  ej: restaurante, KFC, viajes">
  <select id="cat"><option value="">Todas las categorías</option></select>
  <select id="banco"><option value="">Todos los bancos</option></select>
  <label class="chk"><input type="checkbox" id="vig" checked style="flex:none"> Solo vigentes</label>
</div>

<div class="conteo" id="conteo"></div>
<div class="grid" id="grid"></div>

<script>
const hoy = new Date().toISOString().slice(0, 10);
const $ = (id) => document.getElementById(id);
let PROMOS = [];

const fecha = (iso) =>
  iso ? new Date(iso + 'T12:00:00').toLocaleDateString('es-EC',
        { day: 'numeric', month: 'short' }) : null;

const dias = (iso) =>
  iso ? Math.round((new Date(iso) - new Date(hoy)) / 86400000) : Infinity;

function opciones(sel, valores) {
  for (const v of [...new Set(valores)].sort())
    sel.insertAdjacentHTML('beforeend', `<option value="${v}">${v}</option>`);
}

function pintar() {
  const q = $('q').value.trim().toLowerCase();
  const cat = $('cat').value, banco = $('banco').value, soloVig = $('vig').checked;

  const lista = PROMOS.filter((p) =>
    (!cat || p.categoria === cat) &&
    (!banco || p.banco === banco) &&
    (!soloVig || !p.vence || p.vence >= hoy) &&
    (!q || `${p.comercio} ${p.titulo} ${p.detalle} ${p.categoria}`.toLowerCase().includes(q))
  );

  $('conteo').textContent =
    `${lista.length} ${lista.length === 1 ? 'promoción' : 'promociones'}`;

  $('grid').innerHTML = lista.length ? lista.map((p) => {
    const d = dias(p.vence);
    // Solo hay botón de copiar cuando la fuente realmente entrega un código.
    const accion = p.codigo
      ? `<button class="btn" data-codigo="${p.codigo}" data-url="${p.url}">Copiar código</button>`
      : `<a class="btn sec" href="${p.url}" target="_blank" rel="noopener">Ver promo</a>`;
    return `
    <article class="promo">
      ${p.imagen ? `<img src="${p.imagen}" alt="" loading="lazy">` : ''}
      <div class="cuerpo">
        <div class="meta">
          <span class="cat">${p.categoria}</span>
          <span class="banco">${p.banco}</span>
        </div>
        <div class="comercio">${p.comercio}</div>
        <div class="titulo">${p.titulo}</div>
        ${p.detalle ? `<div class="detalle">${p.detalle}</div>` : ''}
        <div class="pie">
          <span class="vence ${d <= 7 ? 'pronto' : ''}">${
            p.vence ? (d <= 7 ? `vence en ${d}d` : `hasta ${fecha(p.vence)}`) : 'sin fecha'
          }</span>
          ${accion}
        </div>
      </div>
    </article>`;
  }).join('') : '<p class="vacio">Nada con esos filtros.</p>';
}

// Copiar el código y abrir la promo: lo más cerca de "aplicar directo"
// que se puede hacer sin ser socio del comercio.
$('grid').addEventListener('click', async (e) => {
  const b = e.target.closest('button[data-codigo]');
  if (!b) return;
  await navigator.clipboard.writeText(b.dataset.codigo);
  b.textContent = '¡Copiado!';
  setTimeout(() => window.open(b.dataset.url, '_blank', 'noopener'), 400);
  setTimeout(() => (b.textContent = 'Copiar código'), 2200);
});

for (const id of ['q', 'cat', 'banco', 'vig'])
  $(id).addEventListener('input', pintar);

fetch('../data/promos.json')
  .then((r) => r.json())
  .then((d) => {
    PROMOS = d.promos;
    opciones($('cat'), PROMOS.map((p) => p.categoria));
    opciones($('banco'), PROMOS.map((p) => p.banco));
    $('sello').textContent = `Actualizado ${fecha(d.actualizado.slice(0, 10))}.`;
    pintar();
  })
  .catch(() => ($('grid').innerHTML =
    '<p class="vacio">No se pudo cargar data/promos.json.<br>Corré <code>npm run scrape</code> primero.</p>'));
</script>
</div></body>
</html>
