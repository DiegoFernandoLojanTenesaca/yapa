name: scrape

on:
  schedule:
    # 06:00 en Ecuador (UTC-5), todos los días.
    - cron: '0 11 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run scrape

      - name: Commit si cambió algo
        run: |
          git config user.name  'promos-bot'
          git config user.email 'promos-bot@users.noreply.github.com'
          git add data/
          git diff --staged --quiet && echo 'sin cambios' && exit 0
          git commit -m "promos $(date -u +%F)"
          git push
